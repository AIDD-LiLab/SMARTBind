# SMARTBind runtime environment.
#
# Versions are those of the environment in which the reproduction notebooks and
# scripts in `reproduce/` were last run end to end.
#
#   conda env create -f environment.yml
#   conda activate SMARTBind_env
#
# Only direct dependencies are listed, pinned to major.minor.patch rather than to a
# conda build string, so the solver can pick builds that fit the local platform.
#
# GPU note: pytorch-cuda=11.8 covers NVIDIA compute capability up to sm_89 (L4, A100,
# RTX 40-series).  Newer cards (sm_90 H100, sm_100 B200, sm_120 RTX PRO 6000) need a
# newer pytorch/CUDA pair.  Everything in `reproduce/` also runs on CPU; pass
# `--device cpu`, or let the automatic fallback handle it when no GPU is present.

name: SMARTBind_env

channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.9

  # --- deep learning ---
  # mkl must stay below 2024: pytorch 2.0.x links against the older Intel JIT profiling
  # ABI, and a newer mkl makes `import torch` fail with
  #   ImportError: libtorch_cpu.so: undefined symbol: iJIT_NotifyEvent
  - mkl=2022.1.0
  - pytorch=2.0.1
  - pytorch-cuda=11.8            # drop this line for a CPU-only install
  - torchvision=0.15.2
  - pytorch-lightning=2.0.9

  # --- scientific stack ---
  - numpy=1.26.4
  - pandas=2.1.1
  - scipy=1.11.2
  - statsmodels=0.14.0           # BH-FDR in the Fig. 3a / Supp. Fig. 4c summaries
  - matplotlib=3.8.0
  - seaborn=0.13.0
  - pillow=9.4.0
  - tqdm=4.66.1
  - pyyaml=6.0.1

  # --- chemistry ---
  - openbabel=3.1.1

  # --- experiment configuration and logging ---
  - wandb=0.15.11

  # --- running the notebooks in reproduce/ ---
  - ipykernel=6.30.1
  - jupyter_core=5.8.1
  - jupyter_client=8.6.3

  # --- FAISS index for the Supplementary efficiency benchmark ---
  # Only reproduce/supplementary/faiss_index/ needs this.  Swap in `faiss-cpu` if the
  # GPU build will not solve; every other panel is unaffected either way.
  - faiss-gpu=1.7.3

  - pip=23.2.1
  - pip:
      - rdkit==2025.9.2
      - scikit-learn==1.6.1
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - nbconvert==7.16.4
      - nbformat==5.10.4
